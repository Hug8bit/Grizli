[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grizli"
version = "1.0.0"
description = "Grid Reconfiguration Intelligence for Zero-Loss Integration"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "GRIZLI Team"}
]
keywords = [
    "power-systems",
    "smart-grid",
    "optimization",
    "network-reconfiguration",
    "pandapower",
    "grid2op"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pandapower>=2.13.0",
    "networkx>=3.0",
    "pulp>=2.7.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
rl = [
    "grid2op>=1.9.0",
    "lightsim2grid>=0.7.0",
    "stable-baselines3>=2.0.0",
    "torch>=2.0.0",
    "gymnasium>=0.28.0",
    "tensorboard>=2.14.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
]
all = [
    "grizli[rl,dev]",
]

[project.urls]
Homepage = "https://github.com/YourUsername/grizli"
Documentation = "https://github.com/YourUsername/grizli#readme"
Repository = "https://github.com/YourUsername/grizli.git"
Issues = "https://github.com/YourUsername/grizli/issues"

[project.scripts]
grizli-demo = "demo:main"
grizli-train = "train:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
