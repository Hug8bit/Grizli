[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "grizli-v2"
version = "2.0.0"
description = "GrizliV2 — Grid optimization platform powered by RL. Waze for Electricity."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["smart-grid", "reinforcement-learning", "power-systems", "optimization", "latam"]

dependencies = [
    # Power system simulation
    "pandapower>=2.13",
    "networkx>=3.0",
    # API
    "fastapi>=0.112",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "websockets>=12.0",
    # Data
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
]

[project.optional-dependencies]
rl = [
    "stable-baselines3>=2.3",
    "torch>=2.0",
    "gymnasium>=0.29",
    "grid2op>=1.10",
    "lightsim2grid>=0.8",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",       # for FastAPI test client
    "ruff>=0.5",
    "black>=24.0",
]
all = ["grizli-v2[rl,dev]"]

[project.scripts]
grizli-serve = "backend.main:main"

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "W"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
